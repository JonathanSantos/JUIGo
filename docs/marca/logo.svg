<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d"><title id="t">JUIGo</title><desc id="d">A letra j em traço geométrico num ladrilho de tinta; o pingo é um pixel âmbar.</desc>
<style>
