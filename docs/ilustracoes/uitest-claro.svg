<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-labelledby="t d"><title id="t">uitest dirige a mesma Session do App</title><desc id="d">O App GLFW e o harness uitest são duas cascas sobre a mesma Session; o uitest injeta eventos sintéticos, controla um relógio virtual e tira screenshots determinísticos.</desc>
<style>
svg{--bg:#FAFAFA;--surf:#FFFFFF;--line:#E3E3E3;--border:#D3D3D3;--ink:#121212;--mut:#737373;
--act:#111111;--acttext:#FFFFFF;--sig:#B27A00;--sel:#FEE7A0;--hover:#F0F0F0;--head:#F4F4F4;
--ok:#148446;--bad:#D92D20}

text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
.mono{font-family:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace}
.mut{fill:var(--mut)}.sigt{fill:var(--sig)}.actt{fill:var(--acttext)}.okt{fill:var(--ok)}.badt{fill:var(--bad)}
.bg{fill:var(--bg);stroke:var(--line)}
.box{fill:var(--surf);stroke:var(--border);stroke-width:1.5}
.soft{fill:var(--head);stroke:var(--line);stroke-width:1}
.hov{fill:var(--hover)}
.act{fill:var(--act)}
.sel{fill:var(--sel)}
.sig{fill:none;stroke:var(--sig);stroke-width:2}
.sigf{fill:var(--sig)}
.dash{fill:none;stroke:var(--sig);stroke-width:2;stroke-dasharray:6 5}
.ln{fill:none;stroke:var(--mut);stroke-width:1.5}
.lnd{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 5}
.lnl{fill:none;stroke:var(--border);stroke-width:1}
.arrowhead{fill:var(--mut)}
.sigarrow{fill:var(--sig)}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sigarrow" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect x="0.5" y="0.5" width="879" height="419" rx="12" class="bg"/><text x="32" y="44" font-size="19" font-weight="600" text-anchor="start" >uitest: a mesma Session do App, sem janela</text>
<text x="32" y="68" font-size="13" font-weight="400" text-anchor="start" class="mut" >Roteamento, foco, overlay, captura e timers vivem na Session; o App é só uma casca GLFW por cima.</text>
<rect x="32" y="100" width="380" height="112" rx="10" class="box" />
<text x="52" y="128" font-size="15" font-weight="600" text-anchor="start" >App (produção)</text>
<text x="52" y="154" font-size="12" font-weight="400" text-anchor="start" class="mut" >janela GLFW · eventos do sistema operacional</text>
<text x="52" y="173" font-size="12" font-weight="400" text-anchor="start" class="mut" >relógio real · blit OpenGL</text>
<rect x="468" y="100" width="380" height="112" rx="10" class="box" />
<rect x="468" y="100" width="380" height="112" rx="10" class="sig" />
<text x="488" y="128" font-size="15" font-weight="600" text-anchor="start" >uitest.Harness (testes)</text>
<text x="488" y="154" font-size="12" font-weight="400" text-anchor="start" class="mut mono" >Click · Type · Hover · Key · Drag</text>
<text x="488" y="173" font-size="12" font-weight="400" text-anchor="start" class="mut mono" >Advance(d): relógio virtual, quadro a quadro</text>
<path d="M 222 216 L 400 258" class="ln" marker-end="url(#a)"/>
<path d="M 658 216 L 480 258" class="ln" marker-end="url(#s)"/>
<rect x="212" y="262" width="456" height="66" rx="12" class="act" />
<text x="440" y="290" font-size="17" font-weight="600" text-anchor="middle" class="actt mono" >widget.Session</text>
<text x="440" y="312" font-size="12" font-weight="400" text-anchor="middle" class="actt" >roteamento · foco · overlay · captura · timers · dano</text>
<path d="M 668 296 L 720 296 L 720 352" class="ln" marker-end="url(#s)"/>
<rect x="488" y="358" width="327" height="26" rx="13.0" class="box" />
<text x="651.5" y="373" font-size="12" font-weight="400" text-anchor="middle" class="mono" >Screenshot() → *image.RGBA determinístico</text>
<text x="32" y="362" font-size="12" font-weight="400" text-anchor="start" class="mut" >Seletores: Text, Placeholder, OfType[*Button]().</text>
<text x="32" y="381" font-size="12" font-weight="400" text-anchor="start" class="mut" >Mesma entrada, mesmos bytes: golden tests.</text></svg>
