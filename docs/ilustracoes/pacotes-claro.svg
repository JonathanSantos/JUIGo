<path d="M 232 486 L 232 504 L 766 504 L 766 490" class="ln" marker-end="url(#a)"/>
<text x="499" y="498" font-size="11" font-weight="400" text-anchor="middle" class="mut mono" >theme → render</text>
<rect x="150" y="526" width="698" height="46" rx="8" class="soft" />
<text x="168" y="554" font-size="13" font-weight="600" text-anchor="start" class="mono" >internal/hooks</text>
<text x="292" y="554" font-size="12" font-weight="400" text-anchor="start" class="mut" >repaint e clipboard: a única ponte de state/widget de volta ao App</text>
