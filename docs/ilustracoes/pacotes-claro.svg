<text x="732" y="277" font-size="15" font-weight="600" text-anchor="start" class="mono" >offscreen</text>
<text x="732" y="297" font-size="12" font-weight="400" text-anchor="start" class="mut" >→ PNG</text>
<line x1="499" y1="224" x2="499" y2="250" class="ln" marker-end="url(#a)"/>
<text x="32" y="374.0" font-size="12" font-weight="600" text-anchor="start" class="mut" >NÚCLEO</text>
<rect x="150" y="340" width="698" height="58" rx="8" class="box" />
<text x="164" y="365" font-size="15" font-weight="600" text-anchor="start" class="mono" >widget</text>
<text x="164" y="385" font-size="12" font-weight="400" text-anchor="start" class="mut" >contrato Widget · roteamento · foco · overlay · Session · 40+ widgets</text>
