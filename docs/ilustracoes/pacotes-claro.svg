<line x1="357" y1="310" x2="357" y2="338" class="ln" marker-end="url(#a)"/>
<line x1="499" y1="310" x2="499" y2="338" class="ln" marker-end="url(#a)"/>
<line x1="641" y1="310" x2="641" y2="338" class="ln" marker-end="url(#a)"/>
