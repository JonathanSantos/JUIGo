<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="t d"><title id="t">Cache de glyphs</title><desc id="d">Cada rune é rasterizada uma única vez numa máscara alfa; depois o desenho só copia a máscara com a cor. O caminho quente não aloca.</desc>
