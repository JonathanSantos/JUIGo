<text x="636" y="194" font-size="12" font-weight="400" text-anchor="start" class="mono" >ButtonText / ButtonNormal</text>
<text x="636" y="211" font-size="12" font-weight="600" text-anchor="start" class="okt" >18.9:1  ≥ 4.5  ✓</text>
