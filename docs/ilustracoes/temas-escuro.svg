<text x="372" y="255" font-size="12" font-weight="400" text-anchor="start" class="mono" >0.917</text>
<text x="424" y="255" font-size="12" font-weight="400" text-anchor="start" class="mut" >fio</text>
<rect x="296" y="272" width="64" height="28" rx="4" style="fill:#D3D3D3;stroke:var(--border)"/>
<text x="372" y="291" font-size="12" font-weight="400" text-anchor="start" class="mono" >0.868</text>
<text x="424" y="291" font-size="12" font-weight="400" text-anchor="start" class="mut" >borda</text>
<rect x="296" y="308" width="64" height="28" rx="4" style="fill:#737373;stroke:var(--border)"/>
<text x="372" y="327" font-size="12" font-weight="400" text-anchor="start" class="mono" >0.555</text>
<text x="424" y="327" font-size="12" font-weight="400" text-anchor="start" class="mut" >placeholder</text>
