<text x="604" y="304" font-size="17" font-weight="600" text-anchor="middle" style="fill:#121212">Aa</text>
<text x="636" y="294" font-size="12" font-weight="400" text-anchor="start" class="mono" >Text / Selection</text>
<text x="636" y="311" font-size="12" font-weight="600" text-anchor="start" class="okt" >15.3:1  ≥ 4.5  ✓</text>
