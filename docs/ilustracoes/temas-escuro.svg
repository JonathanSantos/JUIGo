<text x="604" y="154" font-size="17" font-weight="600" text-anchor="middle" style="fill:#121212">Aa</text>
<text x="636" y="144" font-size="12" font-weight="400" text-anchor="start" class="mono" >Text / Background</text>
<text x="636" y="161" font-size="12" font-weight="600" text-anchor="start" class="okt" >18.0:1  ≥ 4.5  ✓</text>
