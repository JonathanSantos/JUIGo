<text x="604" y="354" font-size="17" font-weight="600" text-anchor="middle" style="fill:#B27A00">Aa</text>
<text x="636" y="344" font-size="12" font-weight="400" text-anchor="start" class="mono" >FocusOutline / Background</text>
<text x="636" y="361" font-size="12" font-weight="600" text-anchor="start" class="okt" >3.5:1  ≥ 3  ✓</text>
<rect x="32" y="404" width="816" height="70" rx="10" class="soft" />
<text x="52" y="432" font-size="13" font-weight="600" text-anchor="start" class="mono" >ensureContrast</text>
<text x="176" y="432" font-size="13" font-weight="400" text-anchor="start" class="mut" >move só a luminosidade (matiz e croma ficam) até o par passar.</text>
<text x="52" y="456" font-size="13" font-weight="400" text-anchor="start" class="mut" >Tinta sem croma se inverte no escuro; ação de luminância média se afasta do rótulo até 4.5:1.</text></svg>
